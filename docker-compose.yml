# docker-compose.yml
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: chessflow_db
    environment:
      POSTGRES_USER: chessflow_user
      POSTGRES_PASSWORD: chessflow_password
      POSTGRES_DB: chessflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chessflow_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chessflow_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: chessflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chessflow_network
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chessflow_celery_worker
    environment:
      DATABASE_URL: postgresql://chessflow_user:chessflow_password@db:5432/chessflow_db
      REDIS_URL: redis://redis:6379
      STOCKFISH_PATH: /usr/games/stockfish
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chessflow_network
    restart: unless-stopped
    command: celery -A app.celery_app.celery_app worker --loglevel=info

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chessflow_backend
    environment:
      DATABASE_URL: postgresql://chessflow_user:chessflow_password@db:5432/chessflow_db
      REDIS_URL: redis://redis:6379
      SECRET_KEY: chessflow-secret-key-change-in-production-min-32-chars-here
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      STOCKFISH_PATH: /usr/games/stockfish
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chessflow_network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chessflow_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - chessflow_network
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  postgres_data:
  redis_data:

networks:
  chessflow_network:
    driver: bridge